# Construit la maquette et la publie sur GitHub Pages à chaque push sur main.
# Prérequis, 1 fois : Settings > Pages > Source = « GitHub Actions ».
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main]
  # Relancer à la main depuis l'onglet Actions.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 1 seul déploiement à la fois. Celui en cours va au bout : il n'est pas annulé par un push plus récent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # npm ci : installe exactement les versions de package-lock.json.
      - run: npm ci

      # Vérifie les types, puis produit dist/.
      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
